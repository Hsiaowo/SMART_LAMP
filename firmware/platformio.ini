[platformio]
default_envs = nodemcuv2

[env]
platform = espressif8266@4.2.1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps = bblanchon/ArduinoJson@6.21.5
build_flags = -D ARDUINOJSON_USE_LONG_LONG=1

[env:nodemcuv2]
board = nodemcuv2

[env:d1_mini]
board = d1_mini

